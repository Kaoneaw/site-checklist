function toggleTheme(){document.body.classList.toggle('dark');try{localStorage.setItem(THEME,document.body.classList.contains('dark')?'dark':'light')}catch(e){toast('ไม่สามารถบันทึกโหมดสีได้')}}
function options(arr,value){return arr.map(([v,n])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(n)}</option>`).join('')}

function filters(){refill('fp',[['','ทุกระยะ'],...[...new Set(data.units.map(u=>u.phase||'ไม่ระบุระยะ'))].map(p=>[p,p==='ส่วนกลาง'?p:'ระยะ '+p])]);refill('fu',[['','ทุกหลัง'],...data.units.map(u=>[u.id,u.name])]);refill('fc',[['','ทุกหมวด'],...[...new Set([...cats,...data.tasks.map(t=>t.category)])].map(c=>[c,c])]);refill('fs',[['','ทุกสถานะ'],...statuses.map((s,i)=>[i,s]),['unknown','รอยืนยันสถานะ']]);refill('ft',[['','ทุกประเภท'],['contract','งานตามสัญญา'],['extra','งานเพิ่ม']]);refill('fo',[['','ผู้รับผิดชอบทั้งหมด'],...new Set(data.tasks.map(t=>t.owner).filter(Boolean))].map((v,i)=>Array.isArray(v)?v:[v,v]))}
function filtered(){return data.tasks.filter(t=>(!$('fp').value||phaseOf(t.unitId)===$('fp').value)&&(!$('fu').value||t.unitId===$('fu').value)&&(!$('fc').value||t.category===$('fc').value)&&(!$('fs').value||($('fs').value==='unknown'?t.statusUnconfirmed:!t.statusUnconfirmed&&t.status===Number($('fs').value)))&&(!$('ft').value||t.type===$('ft').value)&&(!$('fo').value||t.owner===$('fo').value)&&t.name.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()))}
function resetFilters(){['search','fp','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');render()}
function percent(ts){return ts.length?Math.round(ts.filter(t=>t.status===2).length/ts.length*100):0}

function phaseOf(id){return data.units.find(u=>u.id===id)?.phase||'ไม่ระบุระยะ'}
function inScope(u){return (!$('fu').value||u.id===$('fu').value)&&(!$('fp').value||(u.phase||'ไม่ระบุระยะ')===$('fp').value)}
function taskLabel(t){return t.statusUnconfirmed?'รอยืนยันสถานะ':statuses[t.status]}
function amountLabel(t){return t.amountKnown===false?'ยังไม่ระบุมูลค่า':money(t.amount)}
function sourcePanel(){try{$('recoverImport').hidden=!localStorage.getItem(KEY+'-before-import')}catch(e){}let imported=data.source?.id==='hdy-master-plan-r3';$('sourcePanel').innerHTML=imported?`<div class="source-panel"><div class="row"><strong>แผนโครงการฮิดายา · R3</strong><span class="grow"></span><span class="badge">อ้างอิง Excel</span></div><p class="small">วิลล่า 12 หลัง · ระยะ 1.1 และ 1.2 · งานโครงสร้างพื้นฐานส่วนกลาง · แผน 14 ก.ย. 2569 – 3 ม.ค. 2570</p><div class="small muted">นับความคืบหน้าจากงานหลักที่เสร็จ งานย่อยไม่ถูกนับซ้ำ · เปอร์เซ็นต์จาก Excel แสดงเป็นข้อมูลต้นทาง ไม่ใช่การยืนยันความคืบหน้าปัจจุบัน</div><div class="small muted">ช่องว่างในแผน = รอยืนยัน ไม่ถือว่าเริ่มหรือเสร็จแล้ว · ไม่สมมติผู้รับผิดชอบ วันที่เสร็จจริง หรือมูลค่างานเพิ่ม</div></div>`:`<div class="source-panel noprint"><strong>พร้อมใช้ข้อมูลโครงการฮิดายาจาก Excel</strong><p class="small">12 หลัง + งานส่วนกลาง · 185 งานหลัก / 632 รายละเอียดงานย่อย · ข้อมูลที่คุณบันทึกไว้ยังคงเดิม</p><button class="primary" onclick="loadWorkbookProject()">ใช้ข้อมูลโครงการจาก Excel</button><div class="small muted" style="margin-top:8px">ระบบจะดาวน์โหลดสำรอง JSON ของข้อมูลเดิมก่อนแทนที่</div></div>`}
function recoverBeforeImport(){try{let previous=JSON.parse(localStorage.getItem(KEY+'-before-import'));if(!validData(previous))throw Error('ข้อมูลสำรองไม่ถูกต้อง');if(!confirm('กลับไปใช้ข้อมูลก่อนโหลดแผน? ข้อมูลปัจจุบันจะเก็บเป็นสำรองในเครื่องแทน'))return;localStorage.setItem(KEY+'-before-import',JSON.stringify(data));data=previous;selected='';view='dashboard';['search','fp','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');save();toast('กู้คืนข้อมูลก่อนโหลดแผนแล้ว')}catch(e){toast('กู้คืนไม่ได้: '+e.message)}}
function loadWorkbookProject(){if(!confirm('ใช้ข้อมูลแผนฮิดายาจาก Excel แทนข้อมูลปัจจุบันทั้งหมด? ระบบจะสร้างไฟล์สำรองข้อมูลเดิมก่อน กรุณาเก็บไฟล์ดาวน์โหลดไว้'))return;try{localStorage.setItem(KEY+'-before-import',JSON.stringify(data))}catch(e){toast('สร้างสำรองในเครื่องไม่ได้ กรุณาสำรอง JSON และเพิ่มพื้นที่จัดเก็บก่อนโหลดแผน');return}backup();data=sample();selected='';view='dashboard';['search','fp','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');save();toast('โหลดแผนฮิดายาแล้ว ข้อมูลเดิมอยู่ในไฟล์สำรอง JSON')}
function subtaskHTML(t){return !t.subtasks?.length?'':`<details class="subtasks" data-detail="${esc(t.id)}"><summary>รายละเอียดงานย่อย ${t.subtasks.length} รายการ · ยืนยันเสร็จแล้ว ${t.subtasks.filter(x=>x.status===2).length}</summary><div>${t.subtasks.map(x=>`<div class="subtask ${x.status===2?'is-done':''}" data-swipe-task="${esc(t.id)}" data-swipe-sub="${esc(x.id)}"><input type="checkbox" aria-label="เสร็จแล้ว ${esc(x.name)}" data-subtask="${esc(t.id)}" data-subid="${esc(x.id)}" ${x.status===2?'checked':''}><div class="grow"><div class="subtask-name">${x.status===2?'✓ ':''}${esc(x.name)}</div><div class="small muted">${x.status===null?'รอยืนยันสถานะ':statuses[x.status]}${x.start?' · เริ่มตามแผน '+date(x.start):''}${x.duration?' · ระยะเวลา '+esc(x.duration):''}${x.due?' · สิ้นสุดคำนวณ '+date(x.due):''}</div>${t.sourceSheet?`<div class="source-meta">Excel: ${esc(t.sourceSheet.trim())}!B${x.sourceRow} · สถานะต้นทาง: ${esc(x.sourceStatus||'ไม่ระบุ')}</div>`:''}</div><select aria-label="สถานะงานย่อย ${esc(x.name)}" data-substatus="${esc(t.id)}" data-subid="${esc(x.id)}">${x.status===null?'<option value="unknown" selected disabled>รอยืนยันสถานะ</option>':''}${options(statuses.map((label,i)=>[i,label]),x.status===null?'unknown':x.status)}</select></div>`).join('')}</div></details>`}
function setSubtask(taskId,subId,checked){setSubtaskStatus(taskId,subId,checked?2:0)}
function setSubtaskStatus(taskId,subId,status){let t=data.tasks.find(t=>t.id===taskId),x=t?.subtasks?.find(x=>x.id===subId);if(!x||![0,1,2].includes(status))return;rememberStatus(t);x.status=status;t.statusUnconfirmed=false;t.status=t.subtasks.every(x=>x.status===2)?2:t.subtasks.some(x=>x.status===2||x.status===1)?1:0;t.completed=t.status===2?(t.completed||today()):'';save();statusNotice(x.name,status,t.status===2?' · งานหลักเสร็จแล้วด้วย':'')}

xtras,templates:templatesView})[view]();opened.forEach(id=>{let el=document.querySelector('details[data-detail="'+CSS.escape(id)+'"]');if(el)el.open=true})}
function dashboard(){let ts=filtered(),us=data.units.filter(inScope);$('content').innerHTML=`<div class="row" style="margin-bottom:16px"><h2>บ้านและยูนิต</h2><span class="muted small">${us.length} หลัง / พื้นที่ · รายการงานตามตัวกรอง</span></div><div class="grid">${us.map(u=>{let tasks=ts.filter(t=>t.unitId===u.id),p=percent(tasks),extra=tasks.filter(t=>t.type==='extra').length;return `<article class="unit"><div class="row"><span class="badge">${u.kind==='infrastructure'?'ส่วนกลาง':u.phase?'ระยะ '+esc(u.phase):'ยูนิต'}</span><span class="grow"></span>${extra?`<span class="badge extra">＋ งานเพิ่ม ${extra}</span>`:''}</div><div class="row" style="margin-top:13px"><span class="num">${esc(u.name)}</span><span class="grow"></span><strong class="green">${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div><div class="small muted">เสร็จ ${tasks.filter(t=>t.status===2).length} / ${tasks.length} งาน <span style="float:right">ค้าง ${tasks.filter(t=>t.status!==2).length} งาน</span></div><footer><button class="link" data-open="${u.id}">ดูเช็คลิสต์ →</button><div><button class="link small" data-editunit="${u.id}">แก้ชื่อ</button><button class="link small danger" data-deleteunit="${u.id}">ลบ</button></div></footer></article>`}).join('')}</div>${!us.length?'<div class="empty">ยังไม่มีหลัง เริ่มต้นด้วยปุ่ม “เพิ่มหลัง”</div>':''}`}
function taskHTML(t){return `<div class="task-wrap ${t.status===2?'is-done':''}"><div class="task" data-swipe-task="${esc(t.id)}"><input type="checkbox" aria-label="เสร็จแล้ว ${esc(t.name)}" data-check="${esc(t.id)}" ${t.status===2?'checked':''}><div class="grow"><div class="current-status s${t.status}" aria-label="สถานะปัจจุบัน">${t.status===2?'✓ ':t.status===1?'◷ ':'○ '}${taskLabel(t)}</div><div class="taskname">${esc(t.name)} ${t.type==='extra'?'<span class="badge extra">งานเพิ่ม</span>':''}${t.statusUnconfirmed?' <span class="badge s0">รอยืนยันสถานะ</span>':''}</div><div class="small muted">${esc(t.owner||'ยังไม่ระบุผู้รับผิดชอบ')} · กำหนด ${date(t.due)} ${t.completed?'· เสร็จจริง '+date(t.completed):''} ${t.due&&t.due<today()&&t.status!==2?'<span class="orange">· เกินกำหนด</span>':''}</div>${t.sourceSheet?`<div class="source-meta">Excel: ${esc(t.sourceSheet.trim())}!B${t.sourceRow} · สถานะต้นทาง: ${esc(t.sourceStatus||'ไม่ระบุ')}${t.sourceProgress!==null?' · '+t.sourceProgress+'%':''}</div>`:''}${t.note?`<div class="small muted">${esc(t.note)}</div>`:''}</div><select aria-label="สถานะ ${esc(t.name)}" data-status="${esc(t.id)}">${t.statusUnconfirmed?'<option value="unknown" selected disabled>รอยืนยันสถานะ</option>':''}${options(statuses.map((s,i)=>[i,s]),t.statusUnconfirmed?'unknown':t.status)}</select><button class="swipe-advance noprint" data-advance="${esc(t.id)}" ${t.status===2?'disabled':''}>${t.status===2?'✓ เสร็จแล้ว':'สถานะถัดไป →'}</button><button class="link noprint" data-edittask="${esc(t.id)}">แก้ไข</button></div>${subtaskHTML(t)}</div>`}
function detail(){let scoped=data.units.filter(inScope);if(!scoped.some(u=>u.id===selected))selected=scoped[0]?.id||'';let u=data.units.find(u=>u.id===selected);let ts=filtered().filter(t=>t.unitId===selected);$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><h2>เช็คลิสต์รายหลัง</h2><select id="detailUnit" aria-label="เลือกหลัง">${options(scoped.map(u=>[u.id,u.name]),selected)}</select><span class="grow"></span>${u?`<button onclick="taskForm(null,'contract',selected)">＋ เพิ่มงานในหลังนี้</button><button onclick="taskForm(null,'extra',selected)" class="orange">＋ งานเพิ่ม</button>`:''}</div>${u?`<div class="swipe-guide noprint">ปัดขวาที่ชื่องาน → สถานะถัดไป · ปัดซ้าย ← ย้อนสถานะ · ยังไม่ได้ทำ → กำลังทำ → เสร็จแล้ว<br>เมื่อเสร็จ แถวจะเป็นสีเขียวพร้อม ✓ · งานที่รอยืนยันจะเริ่มที่ยังไม่ได้ทำ · เปลี่ยนผิดกด “ย้อนกลับ” ได้</div><div class="panel"><div class="row"><h2>${esc(u.name)}</h2><span class="grow"></span><span class="green">${percent(ts)}% · ${ts.length} งานตามตัวกรอง</span></div>${[...new Set(ts.map(t=>t.category))].map(c=>`<section class="section"><h3>${esc(c)}</h3>${ts.filter(t=>t.category===c).map(taskHTML).join('')}</section>`).join('')}${!ts.length?'<div class="empty">ไม่พบรายการงานตามตัวกรอง</div>':''}</div>`:'<div class="empty">เพิ่มหลังก่อนเริ่มเช็คลิสต์</div>'}`}
function matrix(){let ts=filtered(),us=data.units.filter(inScope),groups=new Map();ts.forEach(t=>{let k=JSON.stringify([t.matrixKey||t.name,t.category,t.type]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});$('content').innerHTML=`<div class="row" style="margin-bottom:15px"><h2>ตารางสถานะงาน</h2><span class="small muted">กดสถานะเพื่อเปลี่ยนวนทีละขั้น · กรอบส้ม = งานเพิ่ม</span></div><div class="panel scroll"><table><thead><tr><th>รายการงาน / หมวด</th>${us.map(u=>`<th>${esc(u.name)}</th>`).join('')}</tr></thead><tbody>${[...groups.values()].map(g=>`<tr><td>${esc(g[0].matrixKey||g[0].name)}${g[0].type==='extra'?' <span class="badge extra">งานเพิ่ม</span>':''}<div class="small muted">${esc(g[0].category)}</div></td>${us.map(u=>`<td>${g.filter(t=>t.unitId===u.id).map(t=>`<button title="คลิกเปลี่ยนสถานะ ${esc(t.name)}" class="status s${t.status} ${t.type==='extra'?'matrix-extra':''}" data-cycle="${t.id}">${taskLabel(t)}</button>`).join(' ')||'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table>${!groups.size?'<div class="empty">ไม่พบรายการงานตามตัวกรอง</div>':''}</div>`}
function extras(){let ts=filtered().filter(t=>t.type==='extra');$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><div class="grow"><h2>งานเพิ่ม / งานเปลี่ยนแปลง</h2><div class="muted small">${ts.length} รายการตามตัวกรอง · มูลค่าที่ระบุ ${ts.filter(t=>t.amountKnown!==false).length} รายการ · ยังไม่ระบุมูลค่า ${ts.filter(t=>t.amountKnown===false).length} รายการ</div></div><strong class="orange" style="font-size:24px">฿ ${money(ts.reduce((s,t)=>s+t.amount,0))}</strong><button class="primary" onclick="taskForm(null,'extra')">＋ เพิ่มงานเพิ่ม</button></div><div class="panel scroll"><table><thead><tr>${['หลัง','รายการงาน','เหตุผล / ผู้ขอ','วันที่ขอ','ผู้รับผิดชอบ','กำหนดเสร็จ','เสร็จจริง','มูลค่า (บาท)','สถานะ',''].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(unitName(t.unitId))}</td><td>${esc(t.name)}<div class="small muted">${esc(t.category)}</div></td><td>${esc(t.reason||'—')}</td><td>${date(t.requested)}</td><td>${esc(t.owner||'—')}</td><td>${date(t.due)}</td><td>${date(t.completed)}</td><td class="orange">${amountLabel(t)}</td><td><span class="status s${t.status}">${taskLabel(t)}</span></td><td><button class="link" data-edittask="${t.id}">แก้ไข</button></td></tr>`).join('')}</tbody></table>${!ts.length?'<div class="empty">ไม่พบงานเพิ่มตามตัวกรอง</div>':''}</div>`}
function templatesView(){$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><div class="grow"><h2>เทมเพลตงานมาตรฐาน</h2><div class="muted small">จัดชุดงานครั้งเดียว แล้วนำไปใช้กับหลังที่เลือก · ไม่เพิ่มงานชื่อและหมวดซ้ำ</div></div><button onclick="templateForm()">＋ เพิ่มงานมาตรฐาน</button><button class="primary" onclick="applyForm()">ใช้เทมเพลตกับหลายหลัง</button></div><div class="panel">${data.templates.map(t=>`<div class="row template-row"><div class="grow"><strong>${esc(t.name)}</strong><div class="small muted">${esc(t.category)} · ${t.phase?'ต้นแบบระยะ '+esc(t.phase)+' · ':''}${t.subtaskNames?.length?t.subtaskNames.length+' งานย่อย · ':''}${esc(t.owner||'ยังไม่ระบุผู้รับผิดชอบ')}</div></div><button class="link" data-edittemplate="${t.id}">แก้ไข</button><button class="link danger" data-deletetemplate="${t.id}">ลบ</button></div>`).join('')||'<div class="empty">ยังไม่มีเทมเพลต เพิ่มรายการงานมาตรฐานก่อน</div>'}</div>`}
function unitName(id){return data.units.find(u=>u.id===id)?.name||'—'}
function showModal(title,body,submitLabel='บันทึก'){let m=$('modal');m.innerHTML=`<form id="editor"><div class="row"><h2>${title}</h2><span class="grow"></span><button type="button" class="link" onclick="closeModal()" aria-label="ปิด">✕</button></div>${body}<div class="formfoot"><button type="button" onclick="closeModal()">ยกเลิก</button><button class="primary" type="submit">${submitLabel}</button></div></form>`;m.showModal()}
function closeModal(){$('modal').close()}
function field(title,name,value='',type='text',full=false){return `<label class="field ${full?'full':''}">${title}<input name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required maxlength="150"':''}></label>`}
function categoryField(value){return `<label class="field">หมวดงาน<select name="category">${options([...new Set([...cats,...data.tasks.map(t=>t.category),...data.templates.map(t=>t.category)])].map(c=>[c,c]),value||cats[0])}</select></label>`}
function projectName(){showModal('ชื่อโครงการ',`<div class="formgrid">${field('ชื่อโครงการ','name',data.project,'text',true)}</div>`);$('editor').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('name').trim();if(!v)return;data.project=v;closeModal();save()}}
function unitForm(id){let u=data.units.find(u=>u.id===id);showModal(u?'แก้ชื่อหลัง':'เพิ่มหลัง / ยูนิต',`<div class="formgrid">${field('ชื่อหลัง / ยูนิต','name',u?.name||'','text',true)}<label class="field full">ระยะโครงการ<select name="phase">${options([['','ไม่ระบุระยะ'],['1.1','ระยะ 1.1'],['1.2','ระยะ 1.2'],['ส่วนกลาง','ส่วนกลาง']],u?.phase||'')}</select></label></div>`);$('editor').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(data.units.some(x=>x.name===name&&x.id!==id)){toast('มีชื่อหลังนี้แล้ว');return}let phase=new FormData(e.target).get('phase');if(u)Object.assign(u,{name,phase,kind:phase==='ส่วนกลาง'?'infrastructure':'villa'});else data.units.push({id:uid(),name,phase,kind:phase==='ส่วนกลาง'?'infrastructure':'villa'});closeModal();save()}}
function targets(chosen){return `<div class="full"><div class="row" style="margin-bottom:8px"><strong class="small">เลือกหลังที่ต้องการ</strong><button type="button" class="link small" onclick="document.querySelectorAll('[name=units]').forEach(x=>x.checked=true)">เลือกทุกหลัง</button></div><div class="targets">${data.units.map(u=>`<label><input type="checkbox" name="units" value="${u.id}" ${!chosen||chosen===u.id?'checked':''}>${esc(u.name)}</label>`).join('')}</div></div>`}
function taskForm(id,type='contract',unit){let t=data.tasks.find(t=>t.id===id);if(!data.units.length){toast('เพิ่มหลังก่อนเพิ่มงาน');return}type=t?.type||type;showModal(t?'แก้ไขรายการงาน':type==='extra'?'เพิ่มงานเพิ่ม / เปลี่ยนแปลง':'เพิ่มรายการงาน',`<div class="formgrid">${field('ชื่องาน *','name',t?.name||'','text',true)}${categoryField(t?.category)}<label class="field">ประเภท<select name="type" id="taskType">${options([['contract','งานตามสัญญา'],['extra','งานเพิ่ม']],type)}</select></label>${t?`<label class="field full">หลัง<select name="unitId">${options(data.units.map(u=>[u.id,u.name]),t.unitId)}</select></label>`:targets(unit)}${field('ผู้รับผิดชอบ','owner',t?.owner||'')}<label class="field">สถานะ<select name="status">${t?.statusUnconfirmed?'<option value="unknown" selected>รอยืนยันสถานะ</option>':''}${options(statuses.map((s,i)=>[i,s]),t?.statusUnconfirmed?'unknown':t?.status||0)}</select></label>${field('กำหนดเสร็จ','due',t?.due||'','date')}${field('วันที่เสร็จจริง','completed',t?.completed||'','date')}<div id="extraFields" class="full" style="display:${type==='extra'?'block':'none'}"><div class="formgrid" style="margin:0">${field('เหตุผล / ผู้ขอ','reason',t?.reason||'','text',true)}${field('วันที่ขอ','requested',t?t.requested:today(),'date')}<label class="field">มูลค่าโดยประมาณ (บาท)<input name="amount" type="number" min="0" max="1000000000000" step="0.01" placeholder="ยังไม่ระบุ" value="${esc(t?.amountKnown===false?'':t?.amount??'')}"></label></div></div><label class="field full">หมายเหตุ<textarea name="note" maxlength="3000">${esc(t?.note||'')}</textarea></label>${t?`<button class="danger full" type="button" onclick="deleteTask('${t.id}')">ลบรายการงานนี้</button>`:''}</div>`);$('taskType').onchange=e=>$('extraFields').style.display=e.target.value==='extra'?'block':'none';$('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let ids=t?[f.get('unitId')]:f.getAll('units');if(!ids.length){toast('เลือกอย่างน้อย 1 หลัง');return}let unconfirmed=f.get('status')==='unknown',status=unconfirmed?0:Number(f.get('status')),completed=f.get('completed');if(status!==2&&completed){toast('วันที่เสร็จจริงใช้สำหรับงานสถานะเสร็จแล้วเท่านั้น');return}let obj={name,category:f.get('category'),type:f.get('type'),status,statusUnconfirmed:unconfirmed,owner:f.get('owner').trim(),due:f.get('due'),completed:status===2?(completed||(t?.status===2?'':today())):'',note:f.get('note').trim(),reason:f.get('type')==='extra'?f.get('reason').trim():'',requested:f.get('type')==='extra'?f.get('requested'):'',amount:f.get('type')==='extra'?Number(f.get('amount')||0):0,amountKnown:f.get('type')!=='extra'||f.get('amount')!==''};if(t){if(t.name!==obj.name)delete t.matrixKey;Object.assign(t,obj,{unitId:ids[0]});}else ids.forEach(unitId=>data.tasks.push({...obj,id:uid(),unitId}));closeModal();save();toast('บันทึกรายการงานแล้ว')}}
function deleteTask(id){if(!confirm('ลบรายการงานนี้?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);closeModal();save()}
function templateForm(id){let t=data.templates.find(t=>t.id===id);showModal(t?'แก้ไขงานมาตรฐาน':'เพิ่มงานมาตรฐาน',`<div class="formgrid">${field('ชื่องาน *','name',t?.name||'','text',true)}${categoryField(t?.category)}${field('ผู้รับผิดชอบเริ่มต้น','owner',t?.owner||'')}</div>`);$('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let o={name,category:f.get('category'),owner:f.get('owner').trim()};if(t)Object.assign(t,o);else data.templates.push({...o,id:uid()});closeModal();save()}}
function applyForm(){if(!data.templates.length||!data.units.length){toast('ต้องมีเทมเพลตและอย่างน้อย 1 หลัง');return}showModal('ใช้เทมเพลตงานมาตรฐาน',`<div class="formgrid"><p class="full muted">เลือกงานให้เหมาะกับขอบเขตแต่ละหลัง คลังต้นแบบรวมงานหลายระยะ ข้ามงานตามสัญญาที่ชื่อและหมวดตรงกัน</p>${targets()}<div class="full"><strong>เลือกงานที่จะนำไปใช้</strong><div class="row"><button type="button" class="link" onclick="document.querySelectorAll('[name=templateIds]').forEach(x=>x.checked=true)">เลือกทุกงาน</button><button type="button" class="link" onclick="document.querySelectorAll('[name=templateIds]').forEach(x=>x.checked=false)">ยกเลิกทุกงาน</button></div>${data.templates.map(t=>`<label class="subtask"><input type="checkbox" name="templateIds" value="${esc(t.id)}"><span>${esc(t.name)}<span class="small muted"> · ${esc(t.category)}${t.phase?' · ต้นแบบระยะ '+esc(t.phase):''} · ${t.subtaskNames?.length||0} งานย่อย</span></span></label>`).join('')}</div></div>`,'นำไปใช้');$('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ids=f.getAll('units'),chosen=f.getAll('templateIds');if(!ids.length||!chosen.length){toast('เลือกอย่างน้อย 1 หลัง และ 1 งาน');return}let n=0;ids.forEach(unitId=>data.templates.filter(t=>chosen.includes(t.id)).forEach(t=>{if(!data.tasks.some(x=>x.unitId===unitId&&(x.matrixKey||x.name)===t.name&&x.category===t.category&&x.type==='contract')){data.tasks.push({id:uid(),unitId,name:t.name,category:t.category,owner:t.owner,status:0,type:'contract',due:'',completed:'',note:'',reason:'',requested:'',amount:0,subtasks:(t.subtaskNames||[]).map(name=>({id:uid(),name,status:0,start:'',duration:'',due:''}))});n++}}));closeModal();save();toast(`เพิ่ม ${n} งานแล้ว (ข้ามรายการซ้ำ)`)}}
function setStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(!t||![0,1,2].includes(s))return;rememberStatus(t);t.status=s;t.statusUnconfirmed=false;if(s===2)t.subtasks?.forEach(x=>x.status=2);else if(s===0)t.subtasks?.forEach(x=>x.status=0);t.completed=s===2?(t.completed||today()):'';save();statusNotice(t.name,s)}
function clearDemo(){if(!confirm('ล้างข้อมูลทั้งหมดที่อยู่ในชุดตัวอย่าง รวมการแก้ไขที่คุณทำไว้? ควรสำรอง JSON ก่อน'))return;data={version:1,project:'โครงการของฉัน',units:[],tasks:[],templates:data.templates,demo:false};selected='';resetFilters();save();toast('เริ่มโครงการใหม่แล้ว เก็บเทมเพลตมาตรฐานไว้ให้')}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(){download('site-checklist-'+today()+'.json',JSON.stringify(data,null,2),'application/json');toast('สร้างไฟล์สำรองแล้ว')}
function exportCSV(){let ts=filtered();if(view==='extra')ts=ts.filter(t=>t.type==='extra');if(view==='detail')ts=ts.filter(t=>t.unitId===selected);let rows=[['โครงการ','ระยะ','หลัง / พื้นที่','ชื่องานหลัก','หมวด','สถานะ','ประเภท','เหตุผล/ผู้ขอ','วันที่ขอ','มูลค่าโดยประมาณ (บาท)','ผู้รับผิดชอบ','กำหนดเสร็จ','วันที่เสร็จจริง','หมายเหตุ','ชีตต้นทาง','แถวต้นทาง','สถานะ Excel','เปอร์เซ็นต์ Excel','รายละเอียดงานย่อย'],...ts.map(t=>[data.project,phaseOf(t.unitId),unitName(t.unitId),t.name,t.category,taskLabel(t),t.type==='extra'?'งานเพิ่ม':'งานตามสัญญา',t.reason,t.requested,t.amountKnown===false?'ยังไม่ระบุ':t.amount,t.owner,t.due,t.completed,t.note,t.sourceSheet||'',t.sourceRow||'',t.sourceStatus||'',t.sourceProgress??'',(t.subtasks||[]).map(x=>`${x.name} [${x.status===null?'รอยืนยัน':statuses[x.status]}]${x.start?' เริ่ม '+x.start:''}${x.duration?' ระยะเวลา '+x.duration:''}${x.due?' สิ้นสุดคำนวณ '+x.due:''}`).join('\n')])];let cell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('site-checklist-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(`ส่งออก ${ts.length} งานตามตัวกรองแล้ว`)}
let printDetails=[];window.addEventListener('beforeprint',()=>{if(printDetails.length)return;printDetails=[...document.querySelectorAll('details')].map(el=>({el,open:el.open}));printDetails.forEach(x=>x.el.open=true)});window.addEventListener('afterprint',()=>{printDetails.forEach(x=>x.el.open=x.open);printDetails=[]});
function printReport(){toast('เลือก “บันทึกเป็น PDF” ในหน้าต่างพิมพ์ · รายงานตามมุมมองและตัวกรองปัจจุบัน');window.print()}

function validProjectExtras(d){const text=v=>typeof v==='string'&&v.length<=5000;const safe=v=>typeof v==='string'&&/^[-a-zA-Z0-9_]{1,100}$/.test(v);const date=v=>typeof v==='string'&&(v===''||(/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T00:00:00'))));if(d.source!==undefined&&(!d.source||!text(d.source.id)||!text(d.source.file)))return false;let ids=new Set([...d.units,...d.tasks,...d.templates].map(x=>x.id));for(let u of d.units){if(u.phase!==undefined&&!text(u.phase))return false;if(u.kind!==undefined&&!['villa','infrastructure'].includes(u.kind))return false}let total=0;for(let t of d.tasks){if(t.statusUnconfirmed!==undefined&&(typeof t.statusUnconfirmed!=='boolean'||t.statusUnconfirmed&&t.status!==0))return false;if(t.amountKnown!==undefined&&typeof t.amountKnown!=='boolean')return false;if(t.matrixKey!==undefined&&!text(t.matrixKey))return false;if(t.sourceSheet!==undefined&&(!text(t.sourceSheet)||!Number.isInteger(t.sourceRow)||t.sourceRow<1||!text(t.sourceStatus)||!(t.sourceProgress===null||Number.isFinite(t.sourceProgress)&&t.sourceProgress>=0&&t.sourceProgress<=100)))return false;if(t.subtasks!==undefined){if(!Array.isArray(t.subtasks)||t.subtasks.length>1000)return false;for(let x of t.subtasks){if(!x||!safe(x.id)||ids.has(x.id)||!text(x.name)||!x.name.trim()||![null,0,1,2].includes(x.status)||!date(x.start)||!date(x.due)||!text(x.duration))return false;ids.add(x.id);if(x.sourceStatus!==undefined&&!text(x.sourceStatus))return false;if(x.sourceRow!==undefined&&(!Number.isInteger(x.sourceRow)||x.sourceRow<1))return false;if(++total>100000)return false}}}return d.templates.every(t=>t.phase===undefined||text(t.phase))&&d.templates.every(t=>t.subtaskNames===undefined||Array.isArray(t.subtaskNames)&&t.subtaskNames.length<=1000&&t.subtaskNames.every(text))}

function validData(d){const str=(v,max=5000)=>typeof v==='string'&&v.length<=max;const dt=v=>str(v,10)&&(v===''||(/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T00:00:00'))));if(!d||d.version!==1||!str(d.project,150)||!d.project.trim()||typeof d.demo!=='boolean'||!['units','tasks','templates'].every(k=>Array.isArray(d[k])&&d[k].length<=50000))return false;let ids=new Set();for(let a of [d.units,d.tasks,d.templates])for(let x of a){if(!x||!str(x.id,100)||!/^[-a-zA-Z0-9_]+$/.test(x.id)||ids.has(x.id)||!str(x.name,150)||!x.name.trim())return false;ids.add(x.id)}if(!validProjectExtras(d))return false;let units=new Set(d.units.map(u=>u.id));if(new Set(d.units.map(u=>u.name)).size!==d.units.length)return false;for(let t of d.tasks){if(!units.has(t.unitId)||!str(t.category,150)||!t.category||!['contract','extra'].includes(t.type)||![0,1,2].includes(t.status)||!Number.isFinite(t.amount)||t.amount<0||t.amount>1e12||!['owner','note','reason'].every(k=>str(t[k]))||!['due','completed','requested'].every(k=>dt(t[k]))||(t.status!==2&&t.completed!==''))return false}return d.templates.every(t=>str(t.category,150)&&t.category&&str(t.owner))}
$('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('ไฟล์ใหญ่เกิน 20 MB');let imported=JSON.parse(await file.text());if(!validData(imported))throw Error('โครงสร้างไฟล์ไม่ถูกต้อง หรืออ้างอิงหลังที่ไม่มีอยู่');if(!confirm('กู้คืนข้อมูลนี้แทนที่ข้อมูลปัจจุบันทั้งหมด? แนะนำให้สำรองข้อมูลเดิมก่อน'))return;data=imported;selected='';['search','fp','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');save();toast(storageOK?'กู้คืนและบันทึกข้อมูลแล้ว':'กู้คืนแล้ว แต่ต้องสำรอง JSON เพราะบันทึกในเครื่องไม่ได้')}catch(err){toast('กู้คืนไม่สำเร็จ: '+err.message)}finally{e.target.value=''}};
$('tabs').onclick=e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}};
$('content').onclick=e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.open){selected=d.open;view='detail';$('fu').value='';render()}if(d.editunit)unitForm(d.editunit);if(d.deleteunit&&confirm(`ลบหลัง ${unitName(d.deleteunit)} และงานทั้งหมดในหลังนี้?`)){data.units=data.units.filter(u=>u.id!==d.deleteunit);data.tasks=data.tasks.filter(t=>t.unitId!==d.deleteunit);save()}if(d.edittask)taskForm(d.edittask);if(d.advance)advanceStatus(d.advance,null,1);if(d.cycle){let t=data.tasks.find(t=>t.id===d.cycle);setStatus(t.id,t.statusUnconfirmed?0:(t.status+1)%3)}if(d.edittemplate)templateForm(d.edittemplate);if(d.deletetemplate&&confirm('ลบงานจากเทมเพลต? งานที่เพิ่มในหลังแล้วจะยังคงอยู่')){data.templates=data.templates.filter(t=>t.id!==d.deletetemplate);save()}};
$('content').onchange=e=>{if(e.target.dataset.substatus){setSubtaskStatus(e.target.dataset.substatus,e.target.dataset.subid,Number(e.target.value));return;}if(e.target.dataset.subtask){setSubtask(e.target.dataset.subtask,e.target.dataset.subid,e.target.checked);return;}if(e.target.dataset.check)setStatus(e.target.dataset.check,e.target.checked?2:0);if(e.target.dataset.status)setStatus(e.target.dataset.status,Number(e.target.value));if(e.target.id==='detailUnit'){selected=e.target.value;$('fu').value='';render()}};
['fp','fu','fc','fs','ft','fo'].forEach(id=>$(id).onchange=()=>{if(id==='fu'&&$('fu').value)selected=$('fu').value;render()});$('search').oninput=render;

let statusUndo=null,statusUndoTimer=null;
function rememberStatus(t){statusUndo={id:t.id,before:JSON.parse(JSON.stringify(t))}}
function statusNotice(name,status,suffix=''){clearTimeout(statusUndoTimer);$('actionMessage').textContent=(status===2?'✓ เสร็จแล้ว: ':'เปลี่ยนเป็น'+statuses[status]+': ')+name+suffix;$('actionNotice').hidden=false;statusUndoTimer=setTimeout(()=>{$('actionNotice').hidden=true;statusUndo=null},10000)}
function undoStatusChange(){if(!statusUndo)return;let i=data.tasks.findIndex(t=>t.id===statusUndo.id);if(i<0){$('actionNotice').hidden=true;statusUndo=null;return}data.tasks[i]=statusUndo.before;statusUndo=null;clearTimeout(statusUndoTimer);$('actionNotice').hidden=true;save();toast('ย้อนกลับสถานะแล้ว')}
function advanceStatus(taskId,subId,direction){let t=data.tasks.find(t=>t.id===taskId);if(!t)return;let sub=subId?t.subtasks?.find(x=>x.id===subId):null;if(subId&&!sub)return;let current=sub?sub.status:(t.statusUnconfirmed?null:t.status);let next=current===null?0:Math.max(0,Math.min(2,current+direction));if(next===current){toast(current===2?'✓ งานนี้เสร็จแล้ว':'งานนี้ยังไม่ได้ทำ');return}if(sub)setSubtaskStatus(taskId,subId,next);else setStatus(taskId,next)}
let swipeGesture=null;
$('content').addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button,input,select,textarea,a,summary'))return;let row=e.target.closest('[data-swipe-task]');if(!row)return;swipeGesture={row,pointer:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,horizontal:false};});
$('content').addEventListener('pointermove',e=>{let g=swipeGesture;if(!g||g.pointer!==e.pointerId)return;g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;if(!g.horizontal&&Math.abs(g.dy)>14&&Math.abs(g.dy)>Math.abs(g.dx)){swipeGesture=null;return}if(!g.horizontal&&Math.abs(g.dx)>16&&Math.abs(g.dx)>Math.abs(g.dy)*1.5){g.horizontal=true;g.row.classList.add('swiping');g.row.setPointerCapture?.(e.pointerId)}if(g.horizontal&&e.cancelable)e.preventDefault();});
function cancelSwipe(){if(swipeGesture)swipeGesture.row.classList.remove('swiping');swipeGesture=null}
$('content').addEventListener('pointercancel',cancelSwipe);
$('content').addEventListener('pointerup',e=>{let g=swipeGesture;if(!g||g.pointer!==e.pointerId)return;let dx=e.clientX-g.x,dy=e.clientY-g.y;cancelSwipe();if(!g.horizontal||Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.5)return;advanceStatus(g.row.dataset.swipeTask,g.row.dataset.swipeSub,dx>0?1:-1)});


window.addEventListener('storage',e=>{if(e.key===KEY)toast('ข้อมูลเปลี่ยนจากแท็บอื่น กรุณารีโหลดก่อนแก้ไขต่อ เพื่อป้องกันข้อมูลทับกัน')});render();
</script></html>
