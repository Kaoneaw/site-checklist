<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ไซต์เช็ค • ติดตามงานก่อสร้าง</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{--bg:#f4f6f8;--paper:#fff;--ink:#172e36;--muted:#6d7f85;--line:#e3e9ec;--brand:#087e75;--soft:#e6f3ef;--green:#18845a;--yellow:#b78010;--gray:#8b969e;--orange:#db7a28}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Noto Sans Thai',Tahoma,sans-serif}body.dark{--bg:#111e24;--paper:#1c2c33;--ink:#e1ecee;--muted:#9cb0b7;--line:#31464e;--soft:#203e38}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:10px 15px;min-height:43px}button:hover{border-color:var(--brand);color:var(--brand)}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button.danger{color:#d35d52}header{background:var(--paper);border-bottom:1px solid var(--line);padding:20px 4%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo{background:var(--brand);color:white;font-size:24px;border-radius:12px;width:46px;height:46px;display:grid;place-items:center}.brand{font-size:19px;font-weight:700}.sub{color:var(--muted);font-size:12px}.grow{flex:1}main{max-width:1440px;margin:auto;padding:30px 4%}h1{font-size:27px;margin:0 0 6px}h2{font-size:19px;margin:0}h3{margin:0;font-size:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.intro{margin-bottom:25px}.eyebrow{color:var(--brand);font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 0}.stat,.panel,.unit{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:20px}.stat strong{display:block;font-size:30px;margin-top:7px;font-weight:600}.muted{color:var(--muted)}.green{color:var(--green)}.yellow{color:var(--yellow)}.orange{color:var(--orange)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;background:var(--brand);border-radius:8px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin:27px 0 20px;padding-bottom:10px}.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted)}.tabs .active{background:var(--soft);color:var(--brand);font-weight:600}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.filters input{flex:2;min-width:190px}.filters select{flex:1;min-width:130px}input,select,textarea{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:11px;border-radius:8px;min-width:0}input:focus,textarea:focus,select:focus{outline:2px solid #78b9ac;outline-offset:1px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.unit .num{font-size:26px;font-weight:600}.badge{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--soft);color:var(--brand)}.extra{color:var(--orange);background:#ed8d2518}.unit footer{border-top:1px solid var(--line);margin-top:18px;padding-top:15px;display:flex;justify-content:space-between;align-items:center}.link{border:0;padding:5px;min-height:36px;color:var(--brand);background:transparent}.task{display:flex;gap:12px;border-top:1px solid var(--line);padding:15px 0;align-items:center}.task input[type=checkbox]{width:23px;height:23px;accent-color:var(--brand);flex-shrink:0}.taskname{font-weight:500}.small{font-size:12px}.task select{max-width:145px}.section{margin-top:18px}.empty{text-align:center;padding:50px;color:var(--muted)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted);font-size:12px}td .status{min-width:95px}.status{padding:7px 10px;border-radius:7px;border:0;font-size:12px}.s0{background:#85939e19;color:var(--muted)}.s1{background:#dbaa221b;color:var(--yellow)}.s2{background:#2697651b;color:var(--green)}.matrix-extra{box-shadow:inset 0 0 0 2px var(--orange)}.notice{padding:12px 16px;border:1px dashed #b7d0c7;background:var(--soft);border-radius:9px;font-size:12px;margin-top:24px}.tools{margin-top:25px;display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px}dialog{width:min(680px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:15px;background:var(--paper);color:var(--ink);padding:25px}dialog::backdrop{background:#122b3766;backdrop-filter:blur(3px)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}label.field{display:flex;flex-direction:column;gap:6px;font-size:12px}.full{grid-column:1/-1}textarea{min-height:70px}.targets{display:flex;flex-wrap:wrap;gap:8px}.targets label{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;align-items:center;gap:6px}.formfoot{display:flex;justify-content:flex-end;gap:8px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 23px;border-radius:10px;z-index:10;display:none}.printonly{display:none}.template-row{padding:14px 0;border-bottom:1px solid var(--line)}@media(min-width:1100px){main{padding-top:36px}}@media(max-width:850px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}header{padding:15px 4%}.stat{padding:14px}.stat strong{font-size:25px}}@media(max-width:560px){main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stats .stat:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.task{flex-wrap:wrap}.task .grow{min-width:65%}.intro h1{font-size:23px}header .sub{display:none}.filters select{min-width:43%}.panel{padding:16px}.headeractions{width:100%}.headeractions button{flex:1}}@media print{body,body.dark{--paper:white;--bg:white;--ink:black;--muted:#555;--line:#ddd;background:white;color:black}header button,.tabs,.filters,.tools,.notice,.noprint,.unit footer,dialog,#toast{display:none!important}main{max-width:none;padding:15px}.stats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.printonly{display:block}.scroll{overflow:visible}table{white-space:normal;font-size:10px}.panel,.unit{break-inside:avoid}button{border:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<header><div class="logo">✓</div><div><div class="brand">ไซต์เช็ค<span style="color:var(--brand)">.</span></div><div class="sub">จัดการงานก่อสร้าง ให้ทุกหลังเดินหน้า</div></div><div class="grow"></div><span id="saveState" class="sub">บันทึกอัตโนมัติในเครื่อง</span><div class="row headeractions"><button onclick="toggleTheme()" title="สลับโหมดสี">◐ โหมดสี</button><button onclick="projectName()">แก้ชื่อโครงการ</button></div></header>
<main><div class="row intro"><div class="grow"><div class="eyebrow">ภาพรวมโครงการ / ติดตามความคืบหน้า</div><h1 id="projectTitle"></h1><div class="muted">ทุกงาน ทุกหลัง อยู่ในภาพเดียว</div></div><button onclick="unitForm()">＋ เพิ่มหลัง</button><button class="primary" onclick="taskForm()">＋ เพิ่มรายการงาน</button></div><div id="summary"></div><nav class="tabs" id="tabs"></nav><div class="filters noprint"><input id="search" placeholder="⌕ ค้นหาชื่องาน…" aria-label="ค้นหาชื่องาน"><select id="fu" aria-label="กรองหลัง"></select><select id="fc" aria-label="กรองหมวด"></select><select id="fs" aria-label="กรองสถานะ"></select><select id="ft" aria-label="กรองประเภท"></select><select id="fo" aria-label="กรองผู้รับผิดชอบ"></select><button onclick="resetFilters()">ล้างตัวกรอง</button></div><div id="content"></div><div class="notice" id="demoNotice"></div><div class="tools noprint"><button onclick="exportCSV()">↓ ส่งออก CSV</button><button onclick="printReport()">▤ พิมพ์ / บันทึก PDF</button><button onclick="backup()">↓ สำรองข้อมูล JSON</button><button onclick="document.getElementById('restore').click()">↑ กู้คืนข้อมูล JSON</button><input hidden type="file" id="restore" accept=".json,application/json"><span class="grow"></span><span class="small muted">ข้อมูลเก็บในเบราว์เซอร์นี้ • ควรสำรองข้อมูลเป็นประจำ</span></div></main><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='site-checklist-v1',THEME='site-checklist-theme',cats=['โครงสร้าง','ระบบไฟฟ้า','ระบบประปา','ฉาบปูน','ทาสี','พื้น','ประตูหน้าต่าง','งานภายนอก'],statuses=['ยังไม่ได้ทำ','กำลังทำ','เสร็จแล้ว'];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},money=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}),date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('th-TH'):'—';
function sample(){let units=['A01','A02','A03','A04'].map(name=>({id:uid(),name}));let templates=[['งานฐานรากและเสา','โครงสร้าง'],['เดินสายไฟภายใน','ระบบไฟฟ้า'],['เดินท่อน้ำดี / น้ำทิ้ง','ระบบประปา'],['ฉาบผนังภายใน','ฉาบปูน'],['ทาสีภายใน','ทาสี'],['ปูกระเบื้องพื้น','พื้น'],['ติดตั้งประตูและหน้าต่าง','ประตูหน้าต่าง'],['จัดพื้นที่รอบบ้าน','งานภายนอก']].map(([name,category])=>({id:uid(),name,category,owner:''}));let tasks=[];units.forEach((u,i)=>templates.forEach((t,j)=>tasks.push({id:uid(),unitId:u.id,name:t.name,category:t.category,type:'contract',status:j<4-i?2:j===4-i?1:0,owner:['ทีมช่างสมชาย','ทีมช่างวิชัย','ทีมช่างประปา'][j%3],due:'',completed:j<4-i?today():'',note:'',reason:'',requested:'',amount:0})));tasks.push({id:uid(),unitId:units[0].id,name:'เพิ่มจุดปลั๊กบริเวณห้องครัว',category:'ระบบไฟฟ้า',type:'extra',status:1,owner:'ทีมช่างวิชัย',due:'',completed:'',note:'รอเจ้าของบ้านยืนยันตำแหน่ง',reason:'เจ้าของบ้านขอเพิ่ม',requested:today(),amount:3500},{id:uid(),unitId:units[2].id,name:'ต่อเติมลานซักล้าง',category:'งานภายนอก',type:'extra',status:0,owner:'ทีมช่างสมชาย',due:'',completed:'',note:'',reason:'เจ้าของบ้านขอเพิ่มพื้นที่ใช้งาน',requested:today(),amount:18000});return {version:1,project:'โครงการบ้านสวน เรสซิเดนซ์',units,tasks,templates,demo:true}}
let data,storageOK=true;try{let raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):sample();if(!validData(data))throw Error('รูปแบบข้อมูลไม่ถูกต้อง');localStorage.setItem(KEY,JSON.stringify(data));document.body.classList.toggle('dark',localStorage.getItem(THEME)==='dark')}catch(e){storageOK=false;data={version:1,project:'โครงการของฉัน',units:[],tasks:[],templates:[],demo:false};setTimeout(()=>toast('ไม่สามารถอ่านพื้นที่จัดเก็บได้ กรุณากู้คืนไฟล์สำรองหรืออนุญาตการจัดเก็บ'),500)}
let view='dashboard',selected='',toastTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;$('saveState').textContent='✓ บันทึกแล้วในเครื่อง'}catch(e){storageOK=false;$('saveState').textContent='⚠ บันทึกไม่สำเร็จ กรุณาสำรอง JSON';toast('พื้นที่จัดเก็บไม่พร้อม ข้อมูลยังอยู่ชั่วคราว กรุณาสำรอง JSON')}render()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4000)}
function toggleTheme(){document.body.classList.toggle('dark');try{localStorage.setItem(THEME,document.body.classList.contains('dark')?'dark':'light')}catch(e){toast('ไม่สามารถบันทึกโหมดสีได้')}}
function options(arr,value){return arr.map(([v,n])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(n)}</option>`).join('')}
function refill(id,arr){let old=$(id).value;$(id).innerHTML=options(arr,old);if(![...$(id).options].some(o=>o.value===old))$(id).value=''}
function filters(){refill('fu',[['','ทุกหลัง'],...data.units.map(u=>[u.id,u.name])]);refill('fc',[['','ทุกหมวด'],...[...new Set([...cats,...data.tasks.map(t=>t.category)])].map(c=>[c,c])]);refill('fs',[['','ทุกสถานะ'],...statuses.map((s,i)=>[i,s])]);refill('ft',[['','ทุกประเภท'],['contract','งานตามสัญญา'],['extra','งานเพิ่ม']]);refill('fo',[['','ผู้รับผิดชอบทั้งหมด'],...new Set(data.tasks.map(t=>t.owner).filter(Boolean))].map((v,i)=>Array.isArray(v)?v:[v,v]))}
function filtered(){return data.tasks.filter(t=>(!$('fu').value||t.unitId===$('fu').value)&&(!$('fc').value||t.category===$('fc').value)&&(!$('fs').value||t.status===Number($('fs').value))&&(!$('ft').value||t.type===$('ft').value)&&(!$('fo').value||t.owner===$('fo').value)&&t.name.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()))}
function resetFilters(){['search','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');render()}
function percent(ts){return ts.length?Math.round(ts.filter(t=>t.status===2).length/ts.length*100):0}
function render(){filters();$('projectTitle').textContent=data.project;let all=data.tasks,done=all.filter(t=>t.status===2).length,p=percent(all);$('summary').innerHTML=`<div class="stats">${[['งานทั้งหมด',all.length,''],['เสร็จแล้ว',done,'green'],['กำลังทำ',all.filter(t=>t.status===1).length,'yellow'],['ยังไม่ได้ทำ',all.filter(t=>t.status===0).length,'muted'],['งานเพิ่ม',all.filter(t=>t.type==='extra').length,'orange']].map(([s,n,c])=>`<div class="stat"><span class="${c}"><span class="dot"></span>${s}</span><strong>${n}<span class="small muted"> รายการ</span></strong></div>`).join('')}</div><div class="panel"><div class="row"><strong>ความคืบหน้าทั้งโครงการ</strong><span class="grow"></span><strong class="green">${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div><div class="small muted">เสร็จแล้ว ${done} จาก ${all.length} งาน · ${data.units.length} หลัง · คำนวณจากจำนวนงานที่เสร็จ / งานทั้งหมด รวมงานเพิ่ม</div></div>`;$('tabs').innerHTML=[['dashboard','▦ ภาพรวมแต่ละหลัง'],['detail','☑ เช็คลิสต์รายหลัง'],['matrix','▤ ตาราง Matrix'],['extra','＋ สรุปงานเพิ่ม'],['templates','▧ เทมเพลตงาน']].map(([v,l])=>`<button data-view="${v}" class="${view===v?'active':''}">${l}</button>`).join('');$('demoNotice').innerHTML=data.demo?'คุณกำลังใช้ข้อมูลตัวอย่าง 4 หลัง ลองติ๊กงานหรือเปลี่ยนสถานะได้เลย <button class="link danger" onclick="clearDemo()">ล้างข้อมูลตัวอย่างและเริ่มใช้งานจริง →</button>':'✓ บันทึกอัตโนมัติในเบราว์เซอร์นี้ ข้อมูลไม่ซิงก์ข้ามอุปกรณ์';if(!storageOK)$('saveState').textContent='⚠ บันทึกไม่สำเร็จ กรุณาสำรอง JSON';({dashboard:dashboard,detail:detail,matrix:matrix,extra:extras,templates:templatesView})[view]()}
function dashboard(){let ts=filtered(),us=data.units.filter(u=>!$('fu').value||u.id===$('fu').value);$('content').innerHTML=`<div class="row" style="margin-bottom:16px"><h2>บ้านและยูนิต</h2><span class="muted small">${us.length} หลัง · รายการงานตามตัวกรอง</span></div><div class="grid">${us.map(u=>{let tasks=ts.filter(t=>t.unitId===u.id),p=percent(tasks),extra=tasks.filter(t=>t.type==='extra').length;return `<article class="unit"><div class="row"><span class="badge">ยูนิต</span><span class="grow"></span>${extra?`<span class="badge extra">＋ งานเพิ่ม ${extra}</span>`:''}</div><div class="row" style="margin-top:13px"><span class="num">${esc(u.name)}</span><span class="grow"></span><strong class="green">${p}%</strong></div><div class="progress"><i style="width:${p}%"></i></div><div class="small muted">เสร็จ ${tasks.filter(t=>t.status===2).length} / ${tasks.length} งาน <span style="float:right">ค้าง ${tasks.filter(t=>t.status!==2).length} งาน</span></div><footer><button class="link" data-open="${u.id}">ดูเช็คลิสต์ →</button><div><button class="link small" data-editunit="${u.id}">แก้ชื่อ</button><button class="link small danger" data-deleteunit="${u.id}">ลบ</button></div></footer></article>`}).join('')}</div>${!us.length?'<div class="empty">ยังไม่มีหลัง เริ่มต้นด้วยปุ่ม “เพิ่มหลัง”</div>':''}`}
function taskHTML(t){return `<div class="task"><input type="checkbox" aria-label="เสร็จแล้ว ${esc(t.name)}" data-check="${t.id}" ${t.status===2?'checked':''}><div class="grow"><div class="taskname">${esc(t.name)} ${t.type==='extra'?'<span class="badge extra">งานเพิ่ม</span>':''}</div><div class="small muted">${esc(t.owner||'ยังไม่ระบุผู้รับผิดชอบ')} · กำหนด ${date(t.due)} ${t.completed?'· เสร็จจริง '+date(t.completed):''} ${t.due&&t.due<today()&&t.status!==2?'<span class="orange">· เกินกำหนด</span>':''}</div>${t.note?`<div class="small muted">${esc(t.note)}</div>`:''}</div><select aria-label="สถานะ ${esc(t.name)}" data-status="${t.id}">${options(statuses.map((s,i)=>[i,s]),t.status)}</select><button class="link noprint" data-edittask="${t.id}">แก้ไข</button></div>`}
function detail(){if(!data.units.some(u=>u.id===selected))selected=data.units[0]?.id||'';let u=data.units.find(u=>u.id===selected);let ts=filtered().filter(t=>t.unitId===selected);$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><h2>เช็คลิสต์รายหลัง</h2><select id="detailUnit" aria-label="เลือกหลัง">${options(data.units.map(u=>[u.id,u.name]),selected)}</select><span class="grow"></span>${u?`<button onclick="taskForm(null,'contract',selected)">＋ เพิ่มงานในหลังนี้</button><button onclick="taskForm(null,'extra',selected)" class="orange">＋ งานเพิ่ม</button>`:''}</div>${u?`<div class="panel"><div class="row"><h2>${esc(u.name)}</h2><span class="grow"></span><span class="green">${percent(ts)}% · ${ts.length} งานตามตัวกรอง</span></div>${[...new Set(ts.map(t=>t.category))].map(c=>`<section class="section"><h3>${esc(c)}</h3>${ts.filter(t=>t.category===c).map(taskHTML).join('')}</section>`).join('')}${!ts.length?'<div class="empty">ไม่พบรายการงานตามตัวกรอง</div>':''}</div>`:'<div class="empty">เพิ่มหลังก่อนเริ่มเช็คลิสต์</div>'}`}
function matrix(){let ts=filtered(),us=data.units.filter(u=>!$('fu').value||u.id===$('fu').value),groups=new Map();ts.forEach(t=>{let k=JSON.stringify([t.name,t.category,t.type]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});$('content').innerHTML=`<div class="row" style="margin-bottom:15px"><h2>ตารางสถานะงาน</h2><span class="small muted">กดสถานะเพื่อเปลี่ยนวนทีละขั้น · กรอบส้ม = งานเพิ่ม</span></div><div class="panel scroll"><table><thead><tr><th>รายการงาน / หมวด</th>${us.map(u=>`<th>${esc(u.name)}</th>`).join('')}</tr></thead><tbody>${[...groups.values()].map(g=>`<tr><td>${esc(g[0].name)}${g[0].type==='extra'?' <span class="badge extra">งานเพิ่ม</span>':''}<div class="small muted">${esc(g[0].category)}</div></td>${us.map(u=>`<td>${g.filter(t=>t.unitId===u.id).map(t=>`<button title="คลิกเปลี่ยนสถานะ ${esc(t.name)}" class="status s${t.status} ${t.type==='extra'?'matrix-extra':''}" data-cycle="${t.id}">${statuses[t.status]}</button>`).join(' ')||'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table>${!groups.size?'<div class="empty">ไม่พบรายการงานตามตัวกรอง</div>':''}</div>`}
function extras(){let ts=filtered().filter(t=>t.type==='extra');$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><div class="grow"><h2>งานเพิ่ม / งานเปลี่ยนแปลง</h2><div class="muted small">${ts.length} รายการตามตัวกรอง · มูลค่าโดยประมาณ</div></div><strong class="orange" style="font-size:24px">฿ ${money(ts.reduce((s,t)=>s+t.amount,0))}</strong><button class="primary" onclick="taskForm(null,'extra')">＋ เพิ่มงานเพิ่ม</button></div><div class="panel scroll"><table><thead><tr>${['หลัง','รายการงาน','เหตุผล / ผู้ขอ','วันที่ขอ','ผู้รับผิดชอบ','กำหนดเสร็จ','เสร็จจริง','มูลค่า (บาท)','สถานะ',''].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(unitName(t.unitId))}</td><td>${esc(t.name)}<div class="small muted">${esc(t.category)}</div></td><td>${esc(t.reason||'—')}</td><td>${date(t.requested)}</td><td>${esc(t.owner||'—')}</td><td>${date(t.due)}</td><td>${date(t.completed)}</td><td class="orange">${money(t.amount)}</td><td><span class="status s${t.status}">${statuses[t.status]}</span></td><td><button class="link" data-edittask="${t.id}">แก้ไข</button></td></tr>`).join('')}</tbody></table>${!ts.length?'<div class="empty">ไม่พบงานเพิ่มตามตัวกรอง</div>':''}</div>`}
function templatesView(){$('content').innerHTML=`<div class="row" style="margin-bottom:18px"><div class="grow"><h2>เทมเพลตงานมาตรฐาน</h2><div class="muted small">จัดชุดงานครั้งเดียว แล้วนำไปใช้กับหลังที่เลือก · ไม่เพิ่มงานชื่อและหมวดซ้ำ</div></div><button onclick="templateForm()">＋ เพิ่มงานมาตรฐาน</button><button class="primary" onclick="applyForm()">ใช้เทมเพลตกับหลายหลัง</button></div><div class="panel">${data.templates.map(t=>`<div class="row template-row"><div class="grow"><strong>${esc(t.name)}</strong><div class="small muted">${esc(t.category)} · ${esc(t.owner||'ยังไม่ระบุผู้รับผิดชอบ')}</div></div><button class="link" data-edittemplate="${t.id}">แก้ไข</button><button class="link danger" data-deletetemplate="${t.id}">ลบ</button></div>`).join('')||'<div class="empty">ยังไม่มีเทมเพลต เพิ่มรายการงานมาตรฐานก่อน</div>'}</div>`}
function unitName(id){return data.units.find(u=>u.id===id)?.name||'—'}
function showModal(title,body,submitLabel='บันทึก'){let m=$('modal');m.innerHTML=`<form id="editor"><div class="row"><h2>${title}</h2><span class="grow"></span><button type="button" class="link" onclick="closeModal()" aria-label="ปิด">✕</button></div>${body}<div class="formfoot"><button type="button" onclick="closeModal()">ยกเลิก</button><button class="primary" type="submit">${submitLabel}</button></div></form>`;m.showModal()}
function closeModal(){$('modal').close()}
function field(title,name,value='',type='text',full=false){return `<label class="field ${full?'full':''}">${title}<input name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required maxlength="150"':''}></label>`}
function categoryField(value){return `<label class="field">หมวดงาน<select name="category">${options([...new Set([...cats,...data.tasks.map(t=>t.category),...data.templates.map(t=>t.category)])].map(c=>[c,c]),value||cats[0])}</select></label>`}
function projectName(){showModal('ชื่อโครงการ',`<div class="formgrid">${field('ชื่อโครงการ','name',data.project,'text',true)}</div>`);$('editor').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('name').trim();if(!v)return;data.project=v;closeModal();save()}}
function unitForm(id){let u=data.units.find(u=>u.id===id);showModal(u?'แก้ชื่อหลัง':'เพิ่มหลัง / ยูนิต',`<div class="formgrid">${field('ชื่อหลัง / ยูนิต','name',u?.name||'','text',true)}</div>`);$('editor').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(data.units.some(x=>x.name===name&&x.id!==id)){toast('มีชื่อหลังนี้แล้ว');return}if(u)u.name=name;else data.units.push({id:uid(),name});closeModal();save()}}
function targets(chosen){return `<div class="full"><div class="row" style="margin-bottom:8px"><strong class="small">เลือกหลังที่ต้องการ</strong><button type="button" class="link small" onclick="document.querySelectorAll('[name=units]').forEach(x=>x.checked=true)">เลือกทุกหลัง</button></div><div class="targets">${data.units.map(u=>`<label><input type="checkbox" name="units" value="${u.id}" ${!chosen||chosen===u.id?'checked':''}>${esc(u.name)}</label>`).join('')}</div></div>`}
function taskForm(id,type='contract',unit){let t=data.tasks.find(t=>t.id===id);if(!data.units.length){toast('เพิ่มหลังก่อนเพิ่มงาน');return}type=t?.type||type;showModal(t?'แก้ไขรายการงาน':type==='extra'?'เพิ่มงานเพิ่ม / เปลี่ยนแปลง':'เพิ่มรายการงาน',`<div class="formgrid">${field('ชื่องาน *','name',t?.name||'','text',true)}${categoryField(t?.category)}<label class="field">ประเภท<select name="type" id="taskType">${options([['contract','งานตามสัญญา'],['extra','งานเพิ่ม']],type)}</select></label>${t?`<label class="field full">หลัง<select name="unitId">${options(data.units.map(u=>[u.id,u.name]),t.unitId)}</select></label>`:targets(unit)}${field('ผู้รับผิดชอบ','owner',t?.owner||'')}<label class="field">สถานะ<select name="status">${options(statuses.map((s,i)=>[i,s]),t?.status||0)}</select></label>${field('กำหนดเสร็จ','due',t?.due||'','date')}${field('วันที่เสร็จจริง','completed',t?.completed||'','date')}<div id="extraFields" class="full" style="display:${type==='extra'?'block':'none'}"><div class="formgrid" style="margin:0">${field('เหตุผล / ผู้ขอ','reason',t?.reason||'','text',true)}${field('วันที่ขอ','requested',t?.requested||today(),'date')}<label class="field">มูลค่าโดยประมาณ (บาท)<input name="amount" type="number" min="0" max="1000000000000" step="0.01" value="${esc(t?.amount||0)}"></label></div></div><label class="field full">หมายเหตุ<textarea name="note" maxlength="3000">${esc(t?.note||'')}</textarea></label>${t?`<button class="danger full" type="button" onclick="deleteTask('${t.id}')">ลบรายการงานนี้</button>`:''}</div>`);$('taskType').onchange=e=>$('extraFields').style.display=e.target.value==='extra'?'block':'none';$('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let ids=t?[f.get('unitId')]:f.getAll('units');if(!ids.length){toast('เลือกอย่างน้อย 1 หลัง');return}let status=Number(f.get('status')),completed=f.get('completed');if(status!==2&&completed){toast('วันที่เสร็จจริงใช้สำหรับงานสถานะเสร็จแล้วเท่านั้น');return}let obj={name,category:f.get('category'),type:f.get('type'),status,owner:f.get('owner').trim(),due:f.get('due'),completed:status===2?(completed||today()):'',note:f.get('note').trim(),reason:f.get('type')==='extra'?f.get('reason').trim():'',requested:f.get('type')==='extra'?f.get('requested'):'',amount:f.get('type')==='extra'?Number(f.get('amount')||0):0};if(t)Object.assign(t,obj,{unitId:ids[0]});else ids.forEach(unitId=>data.tasks.push({...obj,id:uid(),unitId}));closeModal();save();toast('บันทึกรายการงานแล้ว')}}
function deleteTask(id){if(!confirm('ลบรายการงานนี้?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);closeModal();save()}
function templateForm(id){let t=data.templates.find(t=>t.id===id);showModal(t?'แก้ไขงานมาตรฐาน':'เพิ่มงานมาตรฐาน',`<div class="formgrid">${field('ชื่องาน *','name',t?.name||'','text',true)}${categoryField(t?.category)}${field('ผู้รับผิดชอบเริ่มต้น','owner',t?.owner||'')}</div>`);$('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let o={name,category:f.get('category'),owner:f.get('owner').trim()};if(t)Object.assign(t,o);else data.templates.push({...o,id:uid()});closeModal();save()}}
function applyForm(){if(!data.templates.length||!data.units.length){toast('ต้องมีเทมเพลตและอย่างน้อย 1 หลัง');return}showModal('ใช้เทมเพลตงานมาตรฐาน',`<div class="formgrid"><p class="full muted">เพิ่มงานมาตรฐาน ${data.templates.length} รายการต่อหลัง ข้ามงานตามสัญญาที่ชื่อและหมวดเดียวกันอยู่แล้ว</p>${targets()}</div>`,'นำไปใช้');$('editor').onsubmit=e=>{e.preventDefault();let ids=new FormData(e.target).getAll('units');if(!ids.length){toast('เลือกอย่างน้อย 1 หลัง');return}let n=0;ids.forEach(unitId=>data.templates.forEach(t=>{if(!data.tasks.some(x=>x.unitId===unitId&&x.name===t.name&&x.category===t.category&&x.type==='contract')){data.tasks.push({id:uid(),unitId,name:t.name,category:t.category,owner:t.owner,status:0,type:'contract',due:'',completed:'',note:'',reason:'',requested:'',amount:0});n++}}));closeModal();save();toast(`เพิ่ม ${n} งานแล้ว (ข้ามรายการซ้ำ)`)}}
function setStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(!t)return;t.status=s;t.completed=s===2?(t.completed||today()):'';save()}
function clearDemo(){if(!confirm('ล้างข้อมูลทั้งหมดที่อยู่ในชุดตัวอย่าง รวมการแก้ไขที่คุณทำไว้? ควรสำรอง JSON ก่อน'))return;data={version:1,project:'โครงการของฉัน',units:[],tasks:[],templates:data.templates,demo:false};selected='';resetFilters();save();toast('เริ่มโครงการใหม่แล้ว เก็บเทมเพลตมาตรฐานไว้ให้')}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(){download('site-checklist-'+today()+'.json',JSON.stringify(data,null,2),'application/json');toast('สร้างไฟล์สำรองแล้ว')}
function exportCSV(){let ts=filtered();if(view==='extra')ts=ts.filter(t=>t.type==='extra');if(view==='detail')ts=ts.filter(t=>t.unitId===selected);let rows=[['โครงการ','หลัง','ชื่องาน','หมวด','สถานะ','ประเภท','เหตุผล/ผู้ขอ','วันที่ขอ','มูลค่าโดยประมาณ (บาท)','ผู้รับผิดชอบ','กำหนดเสร็จ','วันที่เสร็จจริง','หมายเหตุ'],...ts.map(t=>[data.project,unitName(t.unitId),t.name,t.category,statuses[t.status],t.type==='extra'?'งานเพิ่ม':'งานตามสัญญา',t.reason,t.requested,t.amount,t.owner,t.due,t.completed,t.note])];let cell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('site-checklist-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(`ส่งออก ${ts.length} งานตามตัวกรองแล้ว`)}
function printReport(){toast('เลือก “บันทึกเป็น PDF” ในหน้าต่างพิมพ์ · รายงานตามมุมมองและตัวกรองปัจจุบัน');window.print()}
function validData(d){const str=(v,max=5000)=>typeof v==='string'&&v.length<=max;const dt=v=>str(v,10)&&(v===''||(/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T00:00:00'))));if(!d||d.version!==1||!str(d.project,150)||!d.project.trim()||typeof d.demo!=='boolean'||!['units','tasks','templates'].every(k=>Array.isArray(d[k])&&d[k].length<=50000))return false;let ids=new Set();for(let a of [d.units,d.tasks,d.templates])for(let x of a){if(!x||!str(x.id,100)||!/^[-a-zA-Z0-9_]+$/.test(x.id)||ids.has(x.id)||!str(x.name,150)||!x.name.trim())return false;ids.add(x.id)}let units=new Set(d.units.map(u=>u.id));if(new Set(d.units.map(u=>u.name)).size!==d.units.length)return false;for(let t of d.tasks){if(!units.has(t.unitId)||!str(t.category,150)||!t.category||!['contract','extra'].includes(t.type)||![0,1,2].includes(t.status)||!Number.isFinite(t.amount)||t.amount<0||t.amount>1e12||!['owner','note','reason'].every(k=>str(t[k]))||!['due','completed','requested'].every(k=>dt(t[k]))||(t.status!==2&&t.completed!==''))return false}return d.templates.every(t=>str(t.category,150)&&t.category&&str(t.owner))}
$('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('ไฟล์ใหญ่เกิน 20 MB');let imported=JSON.parse(await file.text());if(!validData(imported))throw Error('โครงสร้างไฟล์ไม่ถูกต้อง หรืออ้างอิงหลังที่ไม่มีอยู่');if(!confirm('กู้คืนข้อมูลนี้แทนที่ข้อมูลปัจจุบันทั้งหมด? แนะนำให้สำรองข้อมูลเดิมก่อน'))return;data=imported;selected='';['search','fu','fc','fs','ft','fo'].forEach(id=>$(id).value='');save();toast(storageOK?'กู้คืนและบันทึกข้อมูลแล้ว':'กู้คืนแล้ว แต่ต้องสำรอง JSON เพราะบันทึกในเครื่องไม่ได้')}catch(err){toast('กู้คืนไม่สำเร็จ: '+err.message)}finally{e.target.value=''}};
$('tabs').onclick=e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}};
$('content').onclick=e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.open){selected=d.open;view='detail';$('fu').value='';render()}if(d.editunit)unitForm(d.editunit);if(d.deleteunit&&confirm(`ลบหลัง ${unitName(d.deleteunit)} และงานทั้งหมดในหลังนี้?`)){data.units=data.units.filter(u=>u.id!==d.deleteunit);data.tasks=data.tasks.filter(t=>t.unitId!==d.deleteunit);save()}if(d.edittask)taskForm(d.edittask);if(d.cycle){let t=data.tasks.find(t=>t.id===d.cycle);setStatus(t.id,(t.status+1)%3)}if(d.edittemplate)templateForm(d.edittemplate);if(d.deletetemplate&&confirm('ลบงานจากเทมเพลต? งานที่เพิ่มในหลังแล้วจะยังคงอยู่')){data.templates=data.templates.filter(t=>t.id!==d.deletetemplate);save()}};
$('content').onchange=e=>{if(e.target.dataset.check)setStatus(e.target.dataset.check,e.target.checked?2:0);if(e.target.dataset.status)setStatus(e.target.dataset.status,Number(e.target.value));if(e.target.id==='detailUnit'){selected=e.target.value;$('fu').value='';render()}};
['fu','fc','fs','ft','fo'].forEach(id=>$(id).onchange=()=>{if(id==='fu'&&$('fu').value)selected=$('fu').value;render()});$('search').oninput=render;
window.addEventListener('storage',e=>{if(e.key===KEY)toast('ข้อมูลเปลี่ยนจากแท็บอื่น กรุณารีโหลดก่อนแก้ไขต่อ เพื่อป้องกันข้อมูลทับกัน')});render();
</script></html>
